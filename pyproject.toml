[tool.poetry]
name = "quality-inspection-service"
version = "1.0.0"
description = "质检样品留样与复检流程服务"
authors = ["Quality Inspection Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0.23"
pydantic = "^2.5.2"
python-multipart = "^0.0.6"
openpyxl = "^3.1.2"
reportlab = "^4.0.8"
python-dotenv = "^1.0.0"
pytest = "^7.4.3"
httpx = "^0.25.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
